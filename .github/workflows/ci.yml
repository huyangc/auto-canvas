name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Server tests (apps/server) use this database; other tests ignore it.
      AUTO_CANVAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_canvas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm agent-docs:generated:check
      - run: pnpm components:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # vitest.config.ts excludes known inherited failures when CI is set.
      - run: pnpm test:local
